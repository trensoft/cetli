# SPDX-License-Identifier: GPL-3.0-or-later
name: Start gate

# The program is built into an RPM, the RPM is installed in a clean container, and the installed `cetli`
# is started in a headless mutter (tools/start_gate/, docs/RELEASING.md, "The start gate"). One leg for every
# chroot of the COPR project trensoft/cetli, the same list: the check "start gate (<chroot>)" is what a tag
# waits for. The push to main is the run on the commit that is tagged. There is no `if:` and no manual run in this
# file: a job that is skipped leaves a check named "start gate (${{ matrix.chroot }})" on the commit, which
# verify_checks.sh would read as a leg. The negative control, which runs by hand, is the file negative-control.yml.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# The jobs only read the repository: no write scope for the token.
permissions:
  contents: read

jobs:
  start-gate:
    name: start gate (${{ matrix.chroot }})
    runs-on: ubuntu-24.04
    # Measured in rootless roots: under 20 s without the downloads. 40 min leaves room for dnf to fetch
    # gnome-shell and its dependencies, and still cuts off a hang far below 360 min.
    timeout-minutes: 40
    strategy:
      # every leg runs to its end, so one red leg does not hide another
      fail-fast: false
      matrix:
        include:
          - chroot: epel-10
            image: quay.io/centos/centos:stream10
          - chroot: fedora-43
            image: registry.fedoraproject.org/fedora:43
          - chroot: fedora-44
            image: registry.fedoraproject.org/fedora:44
          - chroot: fedora-rawhide
            image: registry.fedoraproject.org/fedora:rawhide
    steps:
      # the token is not kept in .git/config: the code under test runs in the containers and can read /src
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Build the RPM, install it in a clean container, start it
        env:
          START_GATE_ENGINE: docker
        run: bash tools/start_gate/start_gate.sh "${{ matrix.image }}"
